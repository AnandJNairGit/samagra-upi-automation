# ==============================================================================
# Samagra UPI Automation - Primary / Development Docker Compose
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16.8-alpine
    container_name: upi-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-training_payments}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_to_a_secure_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - ./docker/postgres/data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-app_user} -d $${POSTGRES_DB:-training_payments}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ----------------------------------------------------------------------------
  # FastAPI Backend Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      target: development
    container_name: upi-backend
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8001}:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-samagra-upi-automation}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://app_user:change_me_to_a_secure_password@postgres:5432/training_payments}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/tests:/app/tests:ro
      - ./backend/alembic:/app/alembic:ro
      - ./backend/alembic.ini:/app/alembic.ini:ro
      - ./backend/scripts:/app/scripts:ro
      - ./backend/pytest.ini:/app/pytest.ini:ro
      - ./seed_manual_test_data.py:/app/seed_manual_test_data.py:ro
      - ./clean_manual_test_data.py:/app/clean_manual_test_data.py:ro
      - ./clear_db.py:/app/clear_db.py:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # Vite + React Frontend Service (Dev Server)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      target: development
    container_name: upi-frontend
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      VITE_BASE_PATH: ${VITE_BASE_PATH:-/upi/}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/upi-api}
      VITE_DEV_BACKEND_TARGET: http://backend:8000
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/index.html:/app/index.html:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5173/upi/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

# ------------------------------------------------------------------------------
# Internal Private Bridge Network
# ------------------------------------------------------------------------------
networks:
  app-network:
    driver: bridge
